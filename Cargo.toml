[package]
name = "fintech-ab-cutover"
version = "0.1.0"
edition = "2021"

[lib]
name = "fintech_ab_cutover"
path = "src/lib.rs"

[[bin]]
name = "risk_service"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
